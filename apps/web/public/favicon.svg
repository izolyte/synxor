<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="synxor">
  <!-- Exchange: two offset arrows pointing opposite ways (⇄) — the two-way
       transfer between sender and receiver. The mark tracks the primary token
       as it swaps light/dark: base stroke is the sRGB equivalent of light
       oklch(0.62 0.100 200); dark mode lifts it to dark oklch(0.68 0.1 200).
       Base lives on the path so renderers that skip the style block still get a
       teal mark. -->
  <style>@media (prefers-color-scheme: dark) { path { stroke: #38abb1 } }</style>
  <path stroke="#1c989e" d="M8 12H22M18.5 8L23.5 12L18.5 16M10 20H24M13.5 16L8.5 20L13.5 24" />
</svg>
